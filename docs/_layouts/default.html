<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ==== Basalt web · tokens from DESIGN.md (Claude warm-editorial system) ==== */
  :root {
    --primary: #cc785c;         /* coral */
    --primary-active: #a9583e;
    --ink: #141413;
    --body: #3d3d3a;
    --body-strong: #252523;
    --muted: #6c6a64;
    --muted-soft: #8e8b82;
    --hairline: #e6dfd8;
    --hairline-soft: #ebe6df;
    --canvas: #faf9f5;
    --surface-soft: #f5f0e8;
    --surface-card: #efe9de;
    --surface-dark: #181715;
    --surface-dark-elevated: #252320;
    --surface-dark-soft: #1f1e1b;
    --on-primary: #ffffff;
    --on-dark: #faf9f5;
    --on-dark-soft: #a09d96;
    --accent-teal: #5db8a6;
    --accent-amber: #e8a55a;
    --success: #5db872;
    --serif: "Cormorant Garamond", Tiempos Headline, Garamond, "Times New Roman", serif;
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--canvas); color: var(--body);
    font: 16px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  /* ==== top-nav: cream, 64px ==== */
  header.site {
    position: sticky; top: 0; z-index: 20;
    background: var(--canvas); border-bottom: 1px solid var(--hairline);
  }
  header.site .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 500; font-size: 17px; letter-spacing: 1px; }
  .brand .mark { width: 18px; height: 18px; color: var(--ink); }
  nav.main { display: flex; align-items: center; gap: 26px; }
  nav.main a.link { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; }
  nav.main a.link:hover { color: var(--ink); }
  nav.main a.link.active { color: var(--ink); }

  /* ==== buttons ==== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 40px; padding: 12px 20px; border-radius: 8px;
    font: 500 14px/1 var(--sans); text-decoration: none; cursor: pointer;
  }
  .btn-primary { background: var(--primary); color: var(--on-primary); }
  .btn-primary:hover { background: var(--primary-active); }
  .btn-secondary { background: var(--canvas); color: var(--ink); border: 1px solid var(--hairline); }
  .btn-secondary:hover { border-color: var(--muted-soft); }
  .btn-cream { background: var(--canvas); color: var(--ink); }
  .btn-sm { height: 34px; padding: 10px 16px; }

  /* ==== hero band: cream, 96px rhythm ==== */
  .hero { padding: 96px 0 72px; }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--primary); color: var(--on-primary);
    font: 500 12px/1.4 var(--sans); letter-spacing: 1.5px; text-transform: uppercase;
    border-radius: 9999px; padding: 4px 12px;
  }
  .hero-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--on-primary); }
  h1.display-xl {
    font: 400 clamp(40px, 6vw, 64px)/1.05 var(--serif);
    letter-spacing: -1.5px; color: var(--ink);
    margin: 20px 0 18px;
  }
  h1.display-xl em { font-style: normal; color: var(--primary); }
  .hero-sub { max-width: 640px; font-size: 17px; line-height: 1.6; color: var(--body); margin: 0 0 28px; }
  .hero-cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .hero-meta { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; }
  .badge-pill {
    background: var(--surface-card); color: var(--ink);
    font: 500 13px/1.4 var(--sans);
    border-radius: 9999px; padding: 4px 12px;
  }
  .badge-teal { background: transparent; border: 1px solid var(--hairline); color: var(--muted); }
  .badge-teal b { color: var(--accent-teal); font-weight: 500; }

  /* ==== dark product band (alternating surface) ==== */
  .band-dark { background: var(--surface-dark); padding: 72px 0; }
  .band-dark h2.display-lg, .band-dark h2.display-md { color: var(--on-dark); }
  .band-dark .lead { color: var(--on-dark-soft); max-width: 640px; margin: 10px 0 36px; font-size: 16px; }
  .dark-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 24px; align-items: start; }
  .mockup {
    background: var(--surface-dark); border: 1px solid var(--surface-dark-elevated);
    border-radius: 12px; overflow: hidden;
  }
  .mockup .chrome {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface-dark-elevated); padding: 10px 14px;
    font: 500 12.5px/1 var(--mono); color: var(--on-dark-soft);
  }
  .mockup .chrome .dots { display: inline-flex; gap: 6px; }
  .mockup .chrome .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-dark); }
  .mockup .chrome .dots i:nth-child(1) { background: #c64545; }
  .mockup .chrome .dots i:nth-child(2) { background: var(--accent-amber); }
  .mockup .chrome .dots i:nth-child(3) { background: var(--accent-teal); }
  .mockup img { display: block; width: 100%; height: auto; }
  .code-window { background: var(--surface-dark); border-radius: 12px; overflow: hidden; border: 1px solid var(--surface-dark-elevated); }
  .code-window .body {
    background: var(--surface-dark-soft); padding: 20px 22px;
    font: 400 13.5px/1.75 var(--mono); color: var(--on-dark);
    overflow-x: auto; white-space: pre;
  }
  .code-window .c-cmd { color: var(--accent-teal); }
  .code-window .c-ok { color: var(--success); }
  .code-window .c-hello { color: var(--accent-amber); }
  .code-window .c-dim { color: var(--on-dark-soft); }

  /* ==== cream bands ==== */
  .band { padding: 96px 0; }
  .band-soft { background: var(--surface-soft); }
  h2.display-lg { font: 400 clamp(30px, 4vw, 48px)/1.1 var(--serif); letter-spacing: -1px; color: var(--ink); margin: 0 0 14px; }
  h2.display-md { font: 400 clamp(26px, 3vw, 36px)/1.15 var(--serif); letter-spacing: -0.5px; color: var(--ink); margin: 0 0 12px; }
  .lead { color: var(--body); max-width: 680px; margin: 0 0 40px; font-size: 16px; }

  /* feature cards: surface-card, 12px radius, 32px padding */
  .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .feature-card {
    background: var(--surface-card); border-radius: 12px; padding: 32px;
  }
  .feature-card .num { font: 400 15px/1 var(--serif); color: var(--primary); letter-spacing: 0; margin-bottom: 14px; display: block; }
  .feature-card h3 { font: 500 18px/1.4 var(--sans); color: var(--ink); margin: 0 0 10px; }
  .feature-card p { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--body); }

  /* doc tiles: canvas + hairline */
  .doc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .doc-tile {
    background: var(--canvas); border: 1px solid var(--hairline);
    border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 8px;
    text-decoration: none;
  }
  .doc-tile:hover { border-color: var(--muted-soft); }
  .doc-tile .kind { font: 500 12px/1.4 var(--sans); letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted-soft); }
  .doc-tile h3 { font: 500 22px/1.3 var(--sans); color: var(--ink); margin: 2px 0; }
  .doc-tile p { margin: 0; font-size: 14.5px; color: var(--body); line-height: 1.6; }
  .doc-tile .go { color: var(--primary); font: 500 14px/1 var(--sans); margin-top: auto; padding-top: 14px; }

  /* boot chain steps */
  .chain { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; counter-reset: step; }
  .step { background: var(--canvas); border: 1px solid var(--hairline); border-radius: 12px; padding: 20px; position: relative; }
  .step .no {
    font: 500 13px/1 var(--mono); color: var(--primary);
    display: inline-block; border: 1px solid var(--hairline); border-radius: 9999px; padding: 5px 12px; margin-bottom: 12px;
  }
  .step h3 { font: 500 16px/1.4 var(--sans); color: var(--ink); margin: 0 0 6px; }
  .step p { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.55; }

  /* ==== coral CTA band ==== */
  .cta-coral {
    background: var(--primary); border-radius: 12px; color: var(--on-primary);
    padding: 64px; margin: 0 0 96px;
  }
  .cta-coral h2 { font: 400 clamp(26px, 3.4vw, 40px)/1.15 var(--serif); letter-spacing: -0.5px; margin: 0 0 12px; }
  .cta-coral p { margin: 0 0 28px; font-size: 16px; opacity: 0.94; }

  /* ==== footer: dark ==== */
  footer.site { background: var(--surface-dark); color: var(--on-dark-soft); padding: 48px 0 40px; }
  footer.site .brand { color: var(--on-dark); }
  footer.site .brand .mark { color: var(--on-dark); }
  footer.site .cols { display: flex; flex-wrap: wrap; gap: 48px; justify-content: space-between; margin-top: 20px; }
  footer.site a { color: var(--on-dark-soft); text-decoration: none; font-size: 14px; display: block; padding: 4px 0; }
  footer.site a:hover { color: var(--on-dark); }
  footer.site .fine { margin-top: 28px; font-size: 13px; color: var(--on-dark-soft); opacity: 0.8; }

  /* ==== markdown-rendered pages (guide, readme) ==== */
  .md-page { max-width: 860px; margin: 0 auto; padding: 56px 24px 96px; }
  .md-page h1 { font: 400 44px/1.1 var(--serif); letter-spacing: -1px; color: var(--ink); margin: 8px 0 20px; padding-bottom: 12px; border-bottom: 1px solid var(--hairline); }
  .md-page h2 { font: 400 30px/1.15 var(--serif); letter-spacing: -0.5px; color: var(--ink); margin: 44px 0 14px; }
  .md-page h3 { font: 500 18px/1.4 var(--sans); color: var(--ink); margin: 30px 0 10px; }
  .md-page p, .md-page li { color: var(--body); line-height: 1.7; }
  .md-page a { color: var(--primary); }
  .md-page table { border-collapse: collapse; width: 100%; margin: 18px 0; font-size: 14px; }
  .md-page th, .md-page td { border: 1px solid var(--hairline); padding: 9px 13px; text-align: left; vertical-align: top; }
  .md-page th { background: var(--surface-card); color: var(--ink); font-weight: 500; }
  .md-page code {
    font: 400 13.5px/1.6 var(--mono);
    background: var(--surface-soft); border: 1px solid var(--hairline);
    border-radius: 6px; padding: 1px 6px; color: var(--body-strong);
  }
  .md-page pre {
    background: var(--surface-dark); border-radius: 12px; padding: 20px 22px;
    overflow-x: auto; margin: 18px 0;
  }
  .md-page pre code { background: none; border: none; padding: 0; color: var(--on-dark); font: 400 13.5px/1.7 var(--mono); }
  .md-page blockquote {
    margin: 18px 0; padding: 6px 20px; color: var(--muted);
    border-left: 3px solid var(--primary); background: var(--surface-soft);
  }
  .md-page img { max-width: 100%; border: 1px solid var(--hairline); border-radius: 16px; }
  .md-page hr { border: none; border-top: 1px solid var(--hairline); margin: 40px 0; }

  .caption { color: var(--muted-soft); font-size: 13.5px; margin-top: -28px; margin-bottom: 40px; }

  /* ==== responsive ==== */
  @media (max-width: 1024px) {
    .dark-grid { grid-template-columns: 1fr; }
    .feature-grid, .doc-grid { grid-template-columns: repeat(2, 1fr); }
    .chain { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .hero { padding: 64px 0 48px; }
    .band { padding: 64px 0; }
    .feature-grid, .doc-grid, .chain { grid-template-columns: 1fr; }
    .cta-coral { padding: 40px 28px; margin-bottom: 64px; }
    nav.main a.link { display: none; }
    nav.main a.link.keep { display: inline; }
  }
</style>
</head>
<body>
