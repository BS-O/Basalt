<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<style>
  :root {
    --bg: #0e1116;
    --panel: #151a22;
    --border: #242b37;
    --text: #d7dde5;
    --muted: #8a94a3;
    --accent: #ff7a45;
    --accent-soft: rgba(255, 122, 69, 0.12);
    --code-bg: #0a0d12;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.75 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px; }
  header {
    border-bottom: 1px solid var(--border);
    background: rgba(14, 17, 22, 0.92);
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(6px);
  }
  header .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .brand {
    color: var(--text); text-decoration: none; font-weight: 700;
    letter-spacing: 2px; font-size: 18px;
  }
  .brand .rock { color: var(--accent); }
  nav a { color: var(--muted); text-decoration: none; margin-left: 22px; font-size: 15px; }
  nav a:hover { color: var(--accent); }
  main { padding: 40px 0 64px; }
  a { color: var(--accent); }
  h1, h2, h3 { color: #f2f5f9; line-height: 1.4; }
  h1 { font-size: 30px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
  h2 { font-size: 22px; margin-top: 40px; }
  h3 { font-size: 18px; }
  table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14.5px; }
  th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
  th { background: var(--panel); color: #eef2f7; }
  tr:nth-child(even) td { background: rgba(21, 26, 34, 0.5); }
  code {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 6px;
    font: 13.5px/1.6 Consolas, "JetBrains Mono", monospace;
  }
  pre {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; overflow-x: auto;
    font: 13.5px/1.6 Consolas, "JetBrains Mono", monospace;
  }
  pre code { background: none; border: none; padding: 0; }
  blockquote {
    margin: 16px 0; padding: 4px 18px;
    border-left: 3px solid var(--accent); color: var(--muted);
    background: var(--accent-soft);
  }
  .badge {
    display: inline-block; padding: 2px 12px; margin: 0 8px 8px 0;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--panel); color: var(--muted); font-size: 13px;
  }
  .badge.ok { border-color: rgba(63, 185, 80, 0.4); color: #56d364; }
  .card {
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel); padding: 18px 20px; margin: 14px 0;
  }
  footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; padding: 20px 0 40px; }
  img.shot { max-width: 100%; border: 1px solid var(--border); border-radius: 8px; display: block; margin: 14px 0; }
  .caption { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="rock">⛰</span> Basalt</a>
    <nav>
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/PROJECT-GUIDE/' | relative_url }}">详细指南</a>
      <a href="https://github.com/BS-O/Basalt">GitHub</a>
    </nav>
  </div>
</header>
<main class="wrap">
{{ content }}
</main>
<footer>
  <div class="wrap">
    Basalt OS · 里程碑 M0 · Limine Boot Protocol ·
    <a href="https://github.com/BS-O/Basalt">github.com/BS-O/Basalt</a>
  </div>
</footer>
</body>
</html>
