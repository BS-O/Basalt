<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ==== Basalt web · OpenCode terminal-native tokens (DESIGN.md opencode.ai) ==== */
  :root {
    --ink: #201d1d;
    --ink-deep: #0f0000;
    --charcoal: #302c2c;
    --body: #424245;
    --mute: #646262;
    --stone: #6e6e73;
    --ash: #9a9898;
    --canvas: #fdfcfc;
    --surface-soft: #f8f7f7;
    --surface-card: #f1eeee;
    --surface-dark: #201d1d;
    --surface-dark-elevated: #302c2c;
    --hairline: rgba(15, 0, 0, 0.12);
    --hairline-strong: #646262;
    --on-dark: #fdfcfc;
    --on-dark-mute: #9a9898;
    --accent: #007aff;
    --warning: #ff9f0a;
    --danger: #ff3b30;
    --success: #30d158;
    /* Berkeley Mono substitute stack per DESIGN.md note */
    --mono: "Berkeley Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--canvas); color: var(--ink);
    font: 400 16px/1.5 var(--mono);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--ink); text-decoration: underline; }
  a:hover { color: var(--ink); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px; }
  .rule { border: none; border-top: 1px solid var(--hairline); margin: 0; }

  /* ==== primary-nav: cream, 56px, hairline bottom ==== */
  .pnav {
    position: sticky; top: 0; z-index: 50;
    background: var(--canvas); border-bottom: 1px solid var(--hairline);
    height: 56px; display: flex; align-items: center;
    padding: 0 max(24px, calc((100% - 1024px) / 2));
  }
  .pnav .wordmark { font-weight: 700; font-size: 16px; text-decoration: none; letter-spacing: 0; }
  .pnav .links { display: flex; gap: 24px; margin-left: auto; align-items: center; }
  .pnav a.nl { color: var(--ink); text-decoration: none; font-weight: 500; font-size: 16px; }
  .pnav a.nl:hover { text-decoration: underline; }
  .pnav a.gh { color: var(--mute); text-decoration: none; font-size: 14px; }
  .pnav a.gh:hover { color: var(--ink); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    font: 500 16px/2 var(--mono);
    padding: 4px 20px; height: 36px; cursor: pointer;
    border-radius: 4px; text-decoration: none;
  }
  .btn-primary { background: var(--ink); color: var(--canvas); border: none; }
  .btn-primary:active { background: var(--ink-deep); }
  .btn-secondary { background: var(--canvas); color: var(--ink); border: 1px solid var(--hairline-strong); }
  .lang-switch { display: flex; margin-left: 16px; border: 1px solid var(--hairline-strong); border-radius: 4px; overflow: hidden; }
  .lang-switch button {
    appearance: none; border: none; cursor: pointer; background: transparent;
    color: var(--mute); font: 500 14px/1.6 var(--mono); padding: 4px 12px;
  }
  .lang-switch button.on { background: var(--ink); color: var(--canvas); }

  /* ==== sections: 96px rhythm, hairline-separated, left-flush text ==== */
  .section { padding: 96px max(24px, calc((100% - 1024px) / 2)); }
  .section-tight { padding: 48px max(24px, calc((100% - 1024px) / 2)); }
  .display-xl { font-size: clamp(28px, 4.4vw, 38px); font-weight: 700; line-height: 1.5; margin: 0 0 24px; }
  .heading-md { font-size: 16px; font-weight: 700; line-height: 1.5; margin: 0; }
  .badge-news {
    display: inline-block; background: var(--surface-dark); color: var(--on-dark);
    font: 400 14px/2 var(--mono); padding: 2px 8px; border-radius: 4px; margin-bottom: 16px;
  }
  p.lead { color: var(--body); font-size: 16px; line-height: 1.5; margin: 0 0 32px; max-width: 720px; }
  p.fine { color: var(--mute); font-size: 14px; line-height: 2; margin: 8px 0 0; }

  /* ==== hero TUI mockup: the single dark surface ==== */
  .tui {
    background: var(--surface-dark); color: var(--on-dark);
    padding: 64px 32px; margin: 0 0 8px;
  }
  .tui pre { font: 400 13px/1.45 var(--mono); margin: 0; text-align: center; color: var(--on-dark); overflow-x: auto; }
  .tui .ascii-wm { margin-bottom: 40px; font-size: 13px; line-height: 1.25; }
  .prompt-row {
    background: var(--surface-dark-elevated); color: var(--on-dark);
    font: 400 16px/1.5 var(--mono); padding: 8px 12px; border-radius: 4px;
    max-width: 640px; margin: 0 auto; text-align: left;
  }
  .prompt-row .pipe { color: var(--accent); }
  .prompt-row .model { color: var(--warning); }
  .prompt-row .dim { color: var(--on-dark-mute); }
  .tui .hints { color: var(--ash); font-size: 14px; line-height: 2; text-align: center; margin-top: 40px; }
  .tui .ok { color: var(--success); }
  .tui .mark { color: var(--warning); }

  /* ==== list rows with ASCII bracket markers ==== */
  .list-row { display: block; padding: 8px 0; color: var(--body); font-size: 16px; line-height: 1.5; }
  .list-row b { color: var(--ink); font-weight: 500; }
  .list-row .marker { color: var(--ink); font-weight: 500; margin-right: 12px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 48px; }

  /* doc links block */
  .doc-links a { display: block; padding: 8px 0; font-size: 16px; line-height: 1.5; color: var(--ink); text-decoration: none; }
  .doc-links a:hover { text-decoration: underline; }
  .doc-links a .marker { color: var(--mute); margin-right: 12px; }

  /* terminal log preview on cream (install-snippet grammar) */
  .snippet {
    background: var(--surface-card); color: var(--ink);
    font: 400 16px/1.5 var(--mono); padding: 12px 16px; border-radius: 4px;
    margin: 16px 0 0; overflow-x: auto; white-space: pre;
  }
  .snippet .ok { color: var(--success); }
  .snippet .mark { color: var(--warning); }
  .snippet .dim { color: var(--mute); }

  /* ==== markdown pages (guide / readme) ==== */
  .md-page { max-width: 860px; margin: 0 auto; padding: 64px 24px 96px; }
  .md-page h1 { font-size: 32px; font-weight: 700; line-height: 1.5; margin: 8px 0 24px; padding-bottom: 16px; border-bottom: 1px solid var(--hairline); }
  .md-page h2 { font-size: 20px; font-weight: 700; margin: 48px 0 16px; }
  .md-page h3 { font-size: 16px; font-weight: 700; margin: 32px 0 12px; }
  .md-page p, .md-page li { color: var(--body); line-height: 1.5; font-size: 16px; }
  .md-page table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px; }
  .md-page th, .md-page td { border: 1px solid var(--hairline); padding: 8px 12px; text-align: left; vertical-align: top; }
  .md-page th { background: var(--surface-soft); color: var(--ink); font-weight: 700; }
  .md-page code { background: var(--surface-card); border-radius: 4px; padding: 1px 5px; font-size: 14px; }
  .md-page pre { background: var(--surface-dark); border-radius: 4px; padding: 16px 20px; overflow-x: auto; margin: 16px 0; }
  .md-page pre code { background: none; padding: 0; color: var(--on-dark); font-size: 14px; line-height: 1.6; }
  .md-page blockquote { margin: 16px 0; padding: 4px 16px; color: var(--mute); border-left: 3px solid var(--hairline-strong); background: var(--surface-soft); }
  .md-page img { max-width: 100%; border-radius: 4px; }
  .md-page hr { border: none; border-top: 1px solid var(--hairline); margin: 40px 0; }
  .src-note { font: 400 14px/2 var(--mono); color: var(--mute); max-width: 860px; margin: -64px auto 80px; padding: 0 24px; }

  /* ==== footer: cream, caption-md, hairline top ==== */
  footer.site { background: var(--canvas); color: var(--body); border-top: 1px solid var(--hairline); padding: 32px max(24px, calc((100% - 1024px) / 2)); }
  footer.site .cols { display: flex; flex-wrap: wrap; gap: 16px 48px; justify-content: space-between; }
  footer.site .col h4 { font: 700 14px/2 var(--mono); color: var(--ink); margin: 0 0 4px; }
  footer.site .col a { display: block; font: 400 14px/2 var(--mono); color: var(--mute); text-decoration: none; }
  footer.site .col a:hover { color: var(--ink); text-decoration: underline; }
  footer.site .legal { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--hairline); font: 400 14px/2 var(--mono); color: var(--mute); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }

  /* ==== responsive ==== */
  @media (max-width: 768px) {
    .pnav .links a.nl:not(.keep) { display: none; }
    .section { padding: 48px 24px; }
    .grid-2 { grid-template-columns: 1fr; }
    .tui { padding: 48px 16px; }
    .md-page { padding: 40px 20px 72px; }
  }
</style>
</head>
<body>
<nav class="pnav">
  <a class="wordmark" href="{{ '/' | relative_url }}">basalt_</a>
  <div class="links">
    <a class="nl" href="{{ '/' | relative_url }}" data-zh="首页" data-en="home">首页</a>
    <a class="nl" href="{{ '/PROJECT-GUIDE/' | relative_url }}" data-zh="指南" data-en="guide">指南</a>
    <a class="nl" href="{{ '/readme/' | relative_url }}">readme</a>
    <a class="gh keep" href="https://github.com/BS-O/Basalt">github</a>
    <div class="lang-switch" role="group" aria-label="language">
      <button type="button" id="lang-zh" class="on">中</button>
      <button type="button" id="lang-en">EN</button>
    </div>
  </div>
</nav>

{{ content }}

<footer class="site">
  <div class="cols">
    <div class="col">
      <h4 data-zh="文档" data-en="docs">文档</h4>
      <a href="{{ '/PROJECT-GUIDE/' | relative_url }}" data-zh="项目详细指南" data-en="project guide">项目详细指南</a>
      <a href="{{ '/readme/' | relative_url }}">readme</a>
      <a href="https://github.com/BS-O/Basalt/blob/main/docs/ARCHITECTURE.md" data-zh="架构设计" data-en="architecture">架构设计</a>
      <a href="https://github.com/BS-O/Basalt/tree/main/docs/adr" data-zh="决策记录 ADR" data-en="decision records">决策记录 ADR</a>
    </div>
    <div class="col">
      <h4 data-zh="仓库" data-en="repository">仓库</h4>
      <a href="https://github.com/BS-O/Basalt">github · BS-O/Basalt</a>
      <a href="https://jihulab.com/BS-O/basalt">jihulab · BS-O/basalt</a>
    </div>
    <div class="col">
      <h4 data-zh="里程碑" data-en="milestone">里程碑</h4>
      <a href="{{ '/' | relative_url }}">M0 · hello world [x]</a>
    </div>
  </div>
  <div class="legal">
    <span>©2026 Basalt · x86-64 kernel · Limine Boot Protocol</span>
    <span data-zh="玄武岩——地壳之下最坚实的那层石头" data-en="basalt — the strongest layer beneath the crust">玄武岩——地壳之下最坚实的那层石头</span>
  </div>
</footer>

<script>
(function () {
  var ZH = 'zh', EN = 'en';
  function apply(lang) {
    document.querySelectorAll('[data-zh]').forEach(function (el) {
      var v = el.getAttribute('data-' + lang);
      if (v !== null) el.textContent = v;
    });
    document.documentElement.lang = (lang === ZH) ? 'zh-CN' : 'en';
    document.getElementById('lang-zh').classList.toggle('on', lang === ZH);
    document.getElementById('lang-en').classList.toggle('on', lang === EN);
    try { localStorage.setItem('basalt-lang', lang); } catch (e) {}
  }
  document.getElementById('lang-zh').addEventListener('click', function () { apply(ZH); });
  document.getElementById('lang-en').addEventListener('click', function () { apply(EN); });
  var saved = null;
  try { saved = localStorage.getItem('basalt-lang'); } catch (e) {}
  if (saved === EN) apply(EN);
})();
</script>
</body>
</html>
